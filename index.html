<title>Mockup Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/export.css">

<canvas id="c" aria-label="Escena 3D del mockup. Arrastra para orbitar, rueda para acercar."></canvas>
<div class="guide" id="guide" hidden><div class="grid3" aria-hidden="true"><i class="v" style="left:33.333%"></i><i class="v" style="left:66.666%"></i><i class="h" style="top:33.333%"></i><i class="h" style="top:66.666%"></i></div><span id="guideLbl">9:16</span></div>
<div class="drop" id="drop">Suelta imágenes o video</div>
<div class="rec" id="rec" hidden><i></i><span id="recTime">00:00 / 00:15</span><button id="recStop">Detener</button></div>

<div class="prog" id="prog" aria-hidden="true"></div>

<aside class="side ui" id="side">
  <div id="pane"></div>
</aside>

<div class="dock ui">
  <section class="row" aria-label="Pantallas">
    <div class="rowhead">
      <span class="label">Pantallas <b id="scrCount">03</b></span>
      <div class="tools">
        <button class="btn icon" id="scrPlay" title="Pausar carrusel" aria-label="Pausar carrusel"><i data-lucide="pause"></i></button>
        <button class="btn icon" id="scrLeft" title="Mover a la izquierda" aria-label="Mover pantalla a la izquierda"><i data-lucide="arrow-left"></i></button>
        <button class="btn icon" id="scrRight" title="Mover a la derecha" aria-label="Mover pantalla a la derecha"><i data-lucide="arrow-right"></i></button>
        <button class="btn icon" id="scrDel" title="Eliminar pantalla" aria-label="Eliminar pantalla seleccionada"><i data-lucide="trash-2"></i></button>
        <button class="btn solid" id="scrAdd"><i data-lucide="image-plus"></i>Cargar</button>
        <button class="tgl" id="scrReplace" role="switch" aria-checked="false" title="Al cargar, reemplaza todas las pantallas en vez de agregar"><span class="tgl-track"><i></i></span>Reemplazar todo</button>
        <input type="file" id="file" accept="image/*,video/*" multiple hidden>
        <input type="file" id="projFile" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="strip" id="strip"></div>
  </section>
</div>
<nav class="rail ui" id="rail" aria-label="Herramientas">
  <button class="btn icon" id="onbHelp" title="Introducción" aria-label="Abrir introducción" aria-expanded="false"><i data-lucide="circle-help"></i></button>
  <button class="btn icon" id="railExport" title="Exportar" aria-label="Exportar" aria-expanded="false"><i data-lucide="download"></i></button>
  <button class="btn icon" id="railDock" title="Mostrar u ocultar pantallas [D]" aria-label="Mostrar u ocultar pantallas" aria-pressed="true"><i data-lucide="panel-bottom"></i></button>
  <button class="btn icon" id="railPanel" title="Mostrar u ocultar controles avanzados" aria-label="Mostrar u ocultar controles avanzados" aria-pressed="false"><i data-lucide="sliders-horizontal"></i></button>
  <button class="btn icon" id="railPlay" title="Reproducir tomas [Espacio]" aria-label="Reproducir tomas" aria-pressed="false"><i data-lucide="play"></i></button>
</nav>
<aside class="onb ui" id="onb" role="dialog" aria-label="Introducción" hidden>
  <div class="onb-bars" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="onb-skip" id="onbSkip">Saltar</button>
  <div class="onb-body" id="onbBody">
    <div class="onb-num" id="onbNum">01</div>
    <h2 id="onbTitle"></h2>
    <p id="onbText"></p>
    <div class="onb-acts" id="onbActs"></div>
  </div>
  <footer class="onb-nav"><button class="btn" id="onbBack">Atrás</button><button class="btn solid" id="onbNext">Siguiente</button></footer>
</aside>
<aside class="exp ui" id="expCard" role="dialog" aria-label="Exportar" hidden>
  <header class="exp-head"><h2>Exportar</h2><button class="exp-link" id="expClose">Cerrar</button></header>
  <div class="exp-out"><span class="exp-lbl">Salida · píxeles</span><div class="exp-size" id="expSize" aria-live="polite"></div></div>
  <div class="exp-main" id="expMain"></div>
  <button class="btn solid exp-go" id="expGo"></button>
  <div class="exp-more">
    <button class="exp-more-t" id="expMoreT" aria-expanded="false" aria-controls="expMoreBody"><span>Más ajustes</span><span id="expMoreI" aria-hidden="true">+</span></button>
    <div class="exp-more-b" id="expMoreBody">
      <div class="exp-stack"><div class="exp-pane" id="expVid"></div><div class="exp-pane" id="expPng"></div></div>
    </div>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/webm-muxer@5.0.3/build/webm-muxer.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
  "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.4/dist/tweakpane.min.js",
  "@tweakpane/plugin-essentials": "https://cdn.jsdelivr.net/npm/@tweakpane/plugin-essentials@0.2.1/dist/tweakpane-plugin-essentials.min.js"
}}
</script>
<script type="module" src="js/main.js"></script>
